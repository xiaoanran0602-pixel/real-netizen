name: 功能建议
description: 想要一个新能力或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 从你的使用场景出发，这个功能要解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你觉得它应该长什么样、怎么运作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代做法（可选）
  - type: checkboxes
    id: contribution
    attributes:
      label: 我能参与
      options:
        - label: 我愿意尝试实现这个功能（maintainer 会协助）
